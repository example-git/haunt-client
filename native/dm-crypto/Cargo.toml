[package]
name = "haunt-dm-crypto"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
openmls = { version = "=0.9.0", features = ["js"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
wasm-bindgen = "=0.2.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tls_codec = { version = "0.5", features = ["derive", "serde"] }
getrandom_old = { package = "getrandom", version = "0.2", features = ["js"] }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
