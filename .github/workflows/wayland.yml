name: Linux screen and output audio
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/wayland.yml
      - apps/desktop/**
      - packages/browser/src/media/**
      - native/linux-*.c
      - scripts/check-wayland.mjs
      - scripts/check-linux-share-audio.mjs
      - scripts/ci/check-wayland.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    name: Capture (${{ matrix.desktop }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: wayland
            packages: sway swaybg wayland-utils pipewire pipewire-pulse wireplumber xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk
          - desktop: x11
            packages: xvfb xauth xfwm4 xdotool pulseaudio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server/client
    steps:
      - uses: actions/checkout@v5
        with:
          repository: example-git/haunt-server
          ref: b8e79640e1b14bdf2bf2629402e18d1b4ed618da
          path: server
      - uses: actions/checkout@v5
        with:
          path: server/client
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/client/package-lock.json
      - name: Install Linux capture test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }} pulseaudio-utils dbus-x11 ffmpeg libpulse-dev libglib2.0-dev libx11-dev libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Start disposable database
        run: |
          docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=chatxo_check postgres:16-alpine
          for attempt in $(seq 1 60); do
            if docker exec chatxo-identity-check pg_isready -U postgres -d chatxo_check; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npm run build && node scripts/build-linux-audio.mjs
      - name: Native Wayland video and PipeWire output audio through server relay
        if: matrix.desktop == 'wayland'
        run: dbus-run-session -- bash scripts/ci/check-wayland.sh
      - name: X11 video and PulseAudio output audio through server relay
        if: matrix.desktop == 'x11'
        env:
          HAUNT_CLIENT_CHECK: linux-share-audio
        run: dbus-run-session -- npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-capture-${{ matrix.desktop }}
          path: server/client/test-results
          retention-days: 14
