name: Linux screen and output audio
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/wayland.yml
      - apps/desktop/**
      - packages/browser/src/media/**
      - native/linux-*.c
      - native/linux-capture-launcher/**
      - vendor/selkies-gstreamer/**
      - scripts/check-linux-capture-runtime.mjs
      - scripts/build-linux-capture.mjs
      - scripts/check-linux-capture-worker.mjs
      - scripts/check-wayland.mjs
      - scripts/check-linux-share-audio.mjs
      - scripts/ci/check-wayland.sh
      - scripts/ci/audio-app.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    name: Capture (${{ matrix.desktop }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: wayland
            packages: swaybg wayland-utils pipewire pipewire-pulse wireplumber xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk
          - desktop: x11
            packages: xvfb xauth xfwm4 xdotool pulseaudio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server/client
    steps:
      - uses: actions/checkout@v5
        with:
          repository: example-git/haunt-server
          ref: b8e79640e1b14bdf2bf2629402e18d1b4ed618da
          path: server
      - uses: actions/checkout@v5
        with:
          path: server/client
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/client/package-lock.json
      - uses: actions/checkout@v5
        if: matrix.desktop == 'wayland'
        with:
          repository: emersion/xdg-desktop-portal-wlr
          ref: v0.8.1
          path: portal-wlr
      - name: Install Linux capture test environment
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }} pulseaudio-utils dbus-x11 ffmpeg libpulse-dev libglib2.0-dev libx11-dev libxrandr-dev libxcomposite-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pipewire libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Start disposable database
        run: |
          docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=chatxo_check postgres:16-alpine
          for attempt in $(seq 1 60); do
            if docker exec chatxo-identity-check pg_isready -U postgres -d chatxo_check; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build software Wayland compositor and portal
        if: matrix.desktop == 'wayland'
        run: |
          sudo apt-get install -y --no-install-recommends meson ninja-build libpipewire-0.3-dev libwayland-dev libinih-dev libgbm-dev libdrm-dev libsystemd-dev libffi-dev libexpat1-dev libxml2-dev libjson-c-dev libpcre2-dev libxkbcommon-dev libcairo2-dev libpango1.0-dev libevdev-dev libudev-dev libmtdev-dev
          git clone --depth 1 --branch 1.45 https://gitlab.freedesktop.org/wayland/wayland-protocols.git "$RUNNER_TEMP/wayland-protocols"
          meson setup "$RUNNER_TEMP/wayland-protocols/build" "$RUNNER_TEMP/wayland-protocols" --prefix="$RUNNER_TEMP/wayland-sdk" -Dtests=false
          meson install -C "$RUNNER_TEMP/wayland-protocols/build"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/wayland-sdk/lib/pkgconfig:$RUNNER_TEMP/wayland-sdk/share/pkgconfig"
          git clone --depth 1 --branch 0.19.2 https://gitlab.freedesktop.org/wlroots/wlroots.git "$RUNNER_TEMP/wlroots"
          git clone --depth 1 --branch 1.23.1 https://gitlab.freedesktop.org/wayland/wayland.git "$RUNNER_TEMP/wlroots/subprojects/wayland"
          git clone --depth 1 --branch libdrm-2.4.124 https://gitlab.freedesktop.org/mesa/drm.git "$RUNNER_TEMP/wlroots/subprojects/libdrm"
          git clone --depth 1 --branch pixman-0.44.2 https://gitlab.freedesktop.org/pixman/pixman.git "$RUNNER_TEMP/wlroots/subprojects/pixman"
          meson setup "$RUNNER_TEMP/wlroots/build" "$RUNNER_TEMP/wlroots" --prefix="$RUNNER_TEMP/wayland-sdk" --libdir=lib --wrap-mode=nodownload -Dbackends=[] -Drenderers=[] -Dallocators=[] -Dxwayland=disabled -Dsession=disabled -Dcolor-management=disabled -Dexamples=false
          meson compile -C "$RUNNER_TEMP/wlroots/build"
          meson install -C "$RUNNER_TEMP/wlroots/build"
          export PATH="$RUNNER_TEMP/wayland-sdk/bin:$PATH" LD_LIBRARY_PATH="$RUNNER_TEMP/wayland-sdk/lib"
          git clone --depth 1 --branch 1.28.1 https://gitlab.freedesktop.org/libinput/libinput.git "$RUNNER_TEMP/libinput"
          meson setup "$RUNNER_TEMP/libinput/build" "$RUNNER_TEMP/libinput" --prefix="$RUNNER_TEMP/wayland-sdk" --libdir=lib -Dtests=false -Ddebug-gui=false -Dlibwacom=false -Ddocumentation=false
          meson compile -C "$RUNNER_TEMP/libinput/build"
          meson install -C "$RUNNER_TEMP/libinput/build"
          git clone --depth 1 --branch 1.11 https://github.com/swaywm/sway.git "$RUNNER_TEMP/sway"
          meson setup "$RUNNER_TEMP/sway/build" "$RUNNER_TEMP/sway" --prefix="$RUNNER_TEMP/wayland-sdk" --libdir=lib -Dman-pages=disabled -Ddefault-wallpaper=false -Dswaybar=false -Dswaynag=false -Dtray=disabled -Dgdk-pixbuf=disabled
          meson compile -C "$RUNNER_TEMP/sway/build"
          meson install -C "$RUNNER_TEMP/sway/build"
          CFLAGS="-include unistd.h" meson setup ../../portal-wlr/build ../../portal-wlr -Dman-pages=disabled -Dsystemd=disabled
          meson compile -C ../../portal-wlr/build
      - name: Verify capture runtime launcher
        run: cd native/linux-capture-launcher && go test ./...
      - run: npm ci
      - run: npm run build && node scripts/build-linux-audio.mjs
      - name: Native Wayland video and PipeWire output audio through server relay
        if: matrix.desktop == 'wayland'
        run: dbus-run-session -- bash scripts/ci/check-wayland.sh
      - name: X11 video and PulseAudio output audio through server relay
        if: matrix.desktop == 'x11'
        env:
          HAUNT_CLIENT_CHECK: linux-share-audio
          HAUNT_EXPECT_ENCODER: ^x264enc$
        run: |
          node scripts/check-linux-capture-worker.mjs
          dbus-run-session -- npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-capture-${{ matrix.desktop }}
          path: server/client/test-results
          retention-days: 14
