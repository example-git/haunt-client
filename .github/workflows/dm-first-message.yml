name: Desktop first DM diagnostics
on:
  push:
    branches: [diagnostics/dm-first-message]
  workflow_dispatch:
    inputs:
      composer:
        description: Exercise composer context menus and clipboard attachments
        type: boolean
        default: false
permissions:
  contents: read
env:
  HAUNT_COMPOSER_MENU: ${{ inputs.composer || 'false' }}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haunt_dm_ci
          POSTGRES_PASSWORD: isolated-dm-fixture
          POSTGRES_DB: haunt_dm_ci
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: example-git/haunt-server
          ref: 6cb3d158267b27d259e658cfba9bbac7e5083b05
          path: fixture-server
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: fixture-server/go.mod
          cache-dependency-path: fixture-server/go.sum
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libnotify4 dbus-x11 gnome-keyring libsecret-1-0 libpulse-dev libglib2.0-dev libx11-dev libxrandr-dev libxcomposite-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev pipewire pipewire-pulse wireplumber gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pipewire ffmpeg postgresql-client
      - run: npm ci
      - run: npm run build && npm run electron:stage
      - run: npx electron-builder --linux --x64 --dir --publish never
      - run: npm run electron:check
      - name: Build the pinned server
        working-directory: fixture-server
        run: go build -trimpath -o ../.runner-state/haunt-dm-server ./cmd/haunt
      - name: Start isolated server
        env:
          HAUNT_INSTANCE_ID: dm-desktop-ci
          HAUNT_NAME: DM desktop CI
          HAUNT_LISTEN_ADDR: 127.0.0.1:18080
          HAUNT_PUBLIC_URL: http://127.0.0.1:18080
          HAUNT_DATABASE_URL: postgres://haunt_dm_ci:isolated-dm-fixture@127.0.0.1:55432/haunt_dm_ci?sslmode=disable
          HAUNT_BOOTSTRAP_USERNAME: owner
          HAUNT_BOOTSTRAP_PASSWORD: isolated DM test password
          HAUNT_DATA_DIR: .runner-state/server
        run: |
          mkdir -p test-results/dm-first-message
          nohup .runner-state/haunt-dm-server > test-results/dm-first-message/server.log 2>&1 < /dev/null &
      - name: Exercise native desktop first messages
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/check-dm-first-message.mjs
      - name: Print server diagnostics
        if: always()
        run: tail -n 100 test-results/dm-first-message/server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dm-first-message-linux
          path: test-results/dm-first-message/
          retention-days: 7
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: example-git/haunt-server
          ref: 6cb3d158267b27d259e658cfba9bbac7e5083b05
          path: fixture-server
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: fixture-server/go.mod
          cache-dependency-path: fixture-server/go.sum
      - run: npm ci
      - run: npm run build && npm run electron:stage
      - run: npx electron-builder --win --x64 --dir --publish never
      - run: npm run electron:check
      - name: Build the pinned server for WSL
        working-directory: fixture-server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -o ../.runner-state/haunt-dm-server ./cmd/haunt
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          use-cache: "false"
          additional-packages: postgresql-16 ffmpeg python3
      - name: Start isolated server and database
        shell: wsl-bash {0}
        run: |
          pg_ctlcluster 16 main start
          runuser -u postgres -- psql -v ON_ERROR_STOP=1 -c "CREATE USER haunt_dm_ci PASSWORD 'isolated-dm-fixture';"
          runuser -u postgres -- createdb -O haunt_dm_ci haunt_dm_ci
          mkdir -p test-results/dm-first-message .runner-state/server
          chmod +x .runner-state/haunt-dm-server
          nohup env HAUNT_INSTANCE_ID=dm-desktop-ci HAUNT_NAME='DM desktop CI' HAUNT_LISTEN_ADDR=127.0.0.1:18080 HAUNT_PUBLIC_URL=http://127.0.0.1:18080 HAUNT_DATABASE_URL=postgres://haunt_dm_ci:isolated-dm-fixture@127.0.0.1:5432/haunt_dm_ci?sslmode=disable HAUNT_BOOTSTRAP_USERNAME=owner HAUNT_BOOTSTRAP_PASSWORD='isolated DM test password' HAUNT_DATA_DIR="$PWD/.runner-state/server" .runner-state/haunt-dm-server > test-results/dm-first-message/server.log 2>&1 < /dev/null &
          echo $! > .runner-state/server.pid
          trap 'cat test-results/dm-first-message/server.log' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          deadline = time.monotonic() + 60
          while True:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/readyz', timeout=2) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(1)
          PY
      - name: Exercise native desktop first messages
        run: node scripts/check-dm-first-message.mjs
      - name: Print server diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test-results/dm-first-message/server.log) {
            Get-Content test-results/dm-first-message/server.log -Tail 100
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dm-first-message-windows
          path: test-results/dm-first-message/
          retention-days: 7
