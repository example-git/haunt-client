name: Deploy standalone web
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: standalone-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:standalone
      - name: Verify cached browser startup and updates
        run: npm run test:standalone
      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v4
        id: cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: deploy
      - name: Verify public deployment
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          node scripts/check-standalone-web.mjs "$DEPLOYMENT_URL"
          printf 'Standalone web: %s\n\nSource commit: %s\n' "$DEPLOYMENT_URL" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-web-evidence
          path: test-results/standalone-web/
          retention-days: 14
