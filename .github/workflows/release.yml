name: Verify component desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    uses: ./.github/workflows/regression.yml
  build:
    timeout-minutes: 40
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: win, arch: x64, target: win32-x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64, target: linux-x64 }
          - {
              os: ubuntu-24.04-arm,
              platform: linux,
              arch: arm64,
              target: linux-arm64,
            }
          - { os: macos-14, platform: mac, arch: arm64, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HAUNT_UPDATE_PUBLIC_KEY: ${{ vars.HAUNT_UPDATE_PUBLIC_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version-file: native/media-worker/go.mod
          cache-dependency-path: native/media-worker/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --run tests/desktop-updates.test.ts tests/desktop-installer.test.ts tests/desktop-appearance.test.ts tests/desktop-tray.test.ts tests/desktop-notifications.test.ts
      - run: npm run build
      - name: Install RPM build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libpulse-dev libglib2.0-dev libx11-dev libxrandr-dev libxcomposite-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pipewire
      - run: npm run electron:stage
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - run: npm run electron:check
      - name: Start packaged Windows client
        if: matrix.platform == 'win'
        run: node scripts/check-packaged-startup.mjs
      - run: npm run updates:pack
        id: pack
      - name: Verify bundled Linux runtime installation and update
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-linux-runtime-install.mjs prepare
          docker run --rm -e CI=true -v "$PWD:/workspace" -w /workspace fedora:44 bash scripts/ci/check-linux-runtime-install.sh
      - name: Install and launch the RPM on Fedora
        if: matrix.platform == 'linux'
        run: docker run --rm --cap-add=SYS_ADMIN -e CI=true -v "$PWD:/workspace" -w /workspace fedora:44 bash scripts/ci/check-fedora-rpm.sh
      - name: Install native Linux test dependencies
        if: ${{ !cancelled() && matrix.platform == 'linux' && steps.pack.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libnotify4 dbus-x11 gnome-keyring libsecret-1-0 python3-dbus python3-gi plank openbox xfwm4 imagemagick desktop-file-utils x11-utils dunst tesseract-ocr xdotool pipewire pipewire-pulse wireplumber pulseaudio-utils
      - name: Verify native screen and window capture
        if: ${{ !cancelled() && matrix.platform == 'linux' && steps.pack.outcome == 'success' }}
        run: node scripts/check-screen.mjs
      - name: Install macOS native UI inspection tools
        if: matrix.platform == 'mac'
        run: brew install tesseract imagemagick cliclick
      - name: Install Windows native UI inspection tools
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          choco install -y tesseract imagemagick --no-progress
          [Environment]::GetEnvironmentVariable("Path", "Machine").Split(";") | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Verify local macOS signing and in-app bundle replacement
        if: matrix.platform == 'mac'
        run: node scripts/check-mac-local-update.mjs
      - name: Rehearse a full installer upgrade on the native runner
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/check-installed-upgrade.mjs
          else
            node scripts/check-installed-upgrade.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-upgrade-${{ matrix.target }}
          path: |
            test-results/installed-upgrade-*.json
            test-results/message-badge*
            test-results/fedora-rpm-*.json
            test-results/linux-runtime-install-*.json
            test-results/fedora-notifications-*.json
            test-results/notification-*
            test-results/mac-local-update.json
            test-results/mac-installer.log
            test-results/mac-keychain-consent.json
      - name: Remove native test signing keychain
        if: ${{ always() && matrix.platform == 'mac' }}
        run: node scripts/mac-ci-keychain.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        with:
          name: release-${{ matrix.target }}
          path: release/updates/*
          if-no-files-found: error
