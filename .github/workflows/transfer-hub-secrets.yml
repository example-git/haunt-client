name: Transfer encrypted hub release credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyNaCl
      - name: Seal credentials for hub repository
        env:
          HAUNT_UPDATE_PRIVATE_KEY: ${{ secrets.HAUNT_UPDATE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PYTHON'
          import base64,json,os
          from pathlib import Path
          from nacl import encoding,public
          key=public.PublicKey("UWV5LCbWtUUE8uB74HDEUrNfb7efb7z/1+yI1jdLKkE=",encoding.Base64Encoder())
          box=public.SealedBox(key)
          names=["HAUNT_UPDATE_PRIVATE_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"]
          if any(not os.environ.get(name) for name in names):
              raise ValueError("Source release credentials are incomplete")
          sealed={name:base64.b64encode(box.encrypt(os.environ[name].encode())).decode() for name in names}
          Path("sealed-secrets.json").write_text(json.dumps({"key_id":"3380204578043523366","values":sealed}))
          print("Sealed three credentials for the hub; plaintext was not exported")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: hub-sealed-secrets
          path: sealed-secrets.json
          retention-days: 1
          if-no-files-found: error
