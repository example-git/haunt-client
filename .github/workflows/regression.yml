name: Client regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      calls:
        description: Exercise call layouts and capture theme screenshots
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results/unit.json
      - run: npm run test:version
      - run: npm run test:browser-harness
      - run: npm run test:chat-stability
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-regression-evidence
          path: test-results/
          retention-days: 14
  calls:
    if: inputs.calls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAUNT_CLIENT_BUILD: dist-standalone
    defaults:
      run:
        working-directory: server/client
    steps:
      - uses: actions/checkout@v5
        with:
          repository: example-git/haunt-server
          ref: 4af54347b9d864c68f7e2716aa8b9f4477f60357
          path: server
      - uses: actions/checkout@v5
        with:
          path: server/client
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/client/package-lock.json
      - name: Install media fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start disposable database
        run: |
          docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=chatxo_check postgres:16-alpine
          for _ in $(seq 1 60); do
            if docker exec chatxo-identity-check pg_isready -U postgres -d chatxo_check; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npm run build && npm run build:standalone
      - name: Exercise calls and detached views
        run: |
          for check in calls call-popout; do
            HAUNT_CLIENT_CHECK="$check" npm run test:integration
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-presentation-evidence
          path: server/client/test-results/
          retention-days: 14
      - name: Remove disposable database
        if: always()
        run: docker rm -f -v chatxo-identity-check
