name: Client regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      calls:
        description: Exercise call layouts and capture theme screenshots
        type: boolean
        default: false
      native_capture:
        description: Exercise native capture and media delivery with fixture devices
        type: boolean
        default: false
      mobile:
        description: Exercise mobile PWA colors, touch navigation and zoom
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results/unit.json
      - run: npm run test:version
      - run: npm run test:browser-harness
      - run: npm run test:chat-stability
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-regression-evidence
          path: test-results/
          retention-days: 14
  calls:
    if: inputs.calls || inputs.native_capture || inputs.mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAUNT_CLIENT_BUILD: dist-standalone
    defaults:
      run:
        working-directory: server/client
    steps:
      - uses: actions/checkout@v5
        with:
          repository: example-git/haunt-server
          ref: 78b01ce078358600d1ffaf206d4e114852bf4b0b
          path: server
      - uses: actions/checkout@v5
        with:
          path: server/client
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/client/package-lock.json
      - name: Install media fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth xfwm4 xdotool pulseaudio pulseaudio-utils python3-dbus python3-gi libpulse-dev libglib2.0-dev libx11-dev libxrandr-dev libxcomposite-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pipewire openbox x11-utils dbus-x11 libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Start disposable database
        run: |
          docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=chatxo_check postgres:16-alpine
          for _ in $(seq 1 60); do
            if docker exec chatxo-identity-check pg_isready -U postgres -d chatxo_check; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npm run build && npm run build:standalone && node scripts/build-linux-audio.mjs
        id: build
      - name: Check Linux shortcut portal protocol
        run: dbus-run-session -- /usr/bin/python3 scripts/check-linux-shortcuts.py release/native/linux/HauntShortcutWorker
      - name: Check native window corners
        if: inputs.calls
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" node scripts/check-window-shape.mjs
      - name: Check voice relay and protocol contracts
        if: always() && inputs.calls && steps.build.outcome == 'success'
        working-directory: server
        env:
          HAUNT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:32768/chatxo_check?sslmode=disable
        run: |
          go run ./cmd/apidocs -check -client-out client/static/api
          go test -race -p 2 ./internal/voice ./internal/httpapi -count=1 -timeout=8m
      - name: Exercise calls and detached views
        if: always() && inputs.calls && steps.build.outcome == 'success'
        run: |
          for check in calls call-popout linux-share-audio; do
            HAUNT_CLIENT_CHECK="$check" dbus-run-session -- npm run test:integration
          done
      - name: Exercise names and appearance
        if: always() && inputs.calls && steps.build.outcome == 'success'
        run: HAUNT_CLIENT_CHECK=media-appearance dbus-run-session -- npm run test:integration
      - name: Exercise native capture and media delivery
        if: always() && inputs.native_capture && steps.build.outcome == 'success'
        run: HAUNT_CLIENT_CHECK=native-media dbus-run-session -- npm run test:integration
      - name: Exercise mobile PWA and existing browser interactions
        if: always() && inputs.mobile && steps.build.outcome == 'success'
        run: |
          for check in mobile-web ui-refresh image-viewer; do
            HAUNT_CLIENT_CHECK="$check" dbus-run-session -- npm run test:integration
          done
      - name: Check standalone offline cache and updates
        if: always() && inputs.mobile && steps.build.outcome == 'success'
        run: npm run test:standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-presentation-evidence
          path: server/client/test-results/
          retention-days: 14
      - name: Remove disposable database
        if: always()
        run: docker rm -f -v chatxo-identity-check
