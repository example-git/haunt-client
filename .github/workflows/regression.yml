name: Client regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results/unit.json
      - run: npm run test:version
      - run: npm run test:browser-harness
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-regression-evidence
          path: test-results/
          retention-days: 14
